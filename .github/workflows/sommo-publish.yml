# sommo-io fork: pack our patched packages (scripts/sommo-publish.mjs) and
# attach them to a GitHub Release. Push a tag `sommo-v<version>`, for example
# `sommo-v3.0.0-next.14-sommo.1`. Upstream's release workflow only runs on main.
name: Release sommo-io packages

on:
  push:
    tags: ['sommo-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: >-
          pnpm install --frozen-lockfile
          --filter "@embedpdf/engine..." --filter "@embedpdf/core..."
          --filter "@embedpdf/plugin-annotation..." --filter "@embedpdf/plugin-stage..."
          --filter "@embedpdf/plugin-actions..." --filter "@embedpdf/plugin-form..."
          --filter "@embedpdf/plugin-link..." --filter "@embedpdf/plugin-measurement..."
          --filter "@embedpdf/plugin-metadata..." --filter "@embedpdf/plugin-render..."
          --filter "@embedpdf/plugin-selection..." --filter "@embedpdf/plugin-signature..."
          --filter "@embedpdf/react..."
      # The engine bundles the PDFium wasm runtime, which the repository does not track.
      - run: bash packages/engine/runtime/scripts/fetch-payload.sh wasm32
      - run: >-
          npx turbo run build
          --filter=@embedpdf/engine --filter=@embedpdf/core
          --filter=@embedpdf/plugin-annotation --filter=@embedpdf/plugin-stage
          --filter=@embedpdf/plugin-actions --filter=@embedpdf/plugin-form
          --filter=@embedpdf/plugin-link --filter=@embedpdf/plugin-measurement
          --filter=@embedpdf/plugin-metadata --filter=@embedpdf/plugin-render
          --filter=@embedpdf/plugin-selection --filter=@embedpdf/plugin-signature
          --filter=@embedpdf/react
      - run: node scripts/sommo-publish.mjs "${GITHUB_REF_NAME#sommo-v}" sommo-dist
      - run: gh release create "$GITHUB_REF_NAME" sommo-dist/*.tgz --title "$GITHUB_REF_NAME" --notes "Patched EmbedPDF packages (Apache-2.0, modified by sommo-io; see LICENSE and NOTICE in each tarball)."
        env:
          GH_TOKEN: ${{ github.token }}
